name: Hope Scroll Shorts Collector 2.0

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

permissions:
  contents: write

concurrency:
  group: hope-scroll-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector
        run: python -m pip install --upgrade yt-dlp

      - name: Collect Hope Scroll Shorts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from datetime import datetime, timezone
          import yt_dlp

          channels = [
              ("Billy Graham", "https://www.youtube.com/@billygraham/shorts"),
              ("Charles Stanley - In Touch", "https://www.youtube.com/channel/UCXL6kvDyoQpvtaeafC4pLyg/shorts"),
              ("T. D. Jakes", "https://www.youtube.com/@TPHDallas/shorts"),
              ("Joseph Prince", "https://www.youtube.com/@JosephPrince/shorts"),
              ("I Am Second", "https://www.youtube.com/@IAm2nd/shorts"),
              ("Delafe Testimonies", "https://www.youtube.com/@delafetestimonies/shorts"),
              ("Jordan B. Peterson", "https://www.youtube.com/@jordanbpeterson/shorts"),
              ("BibleProject", "https://www.youtube.com/@bibleproject/shorts"),
              ("Impact Video Ministries", "https://www.youtube.com/channel/UCTsRTfwxwj4_ep_MNM17lqg/shorts"),
              ("Dr. Caroline Leaf", "https://www.youtube.com/@drcarolineleaf/shorts"),
              ("Biblical Mindset Lab", "https://www.youtube.com/channel/UCMIhjyASZNyoqUh_3mkKDxA/shorts"),
              ("Craig Groeschel", "https://www.youtube.com/@craiggroeschel/shorts"),
              ("Steven Furtick", "https://www.youtube.com/@stevenfurtick/shorts"),
              ("Unity Center of Light", "https://www.youtube.com/@unitycenteroflight/shorts"),
              ("Reasonable Faith UK", "https://www.youtube.com/@reasonablefaithuk/shorts"),
              ("Parousia Media", "https://www.youtube.com/@parousiamedia/shorts"),
              ("The Lila Rose Show", "https://www.youtube.com/@lilaroseshow/shorts"),
              ("Bible Alive", "https://www.youtube.com/@bible_alive/shorts"),
              ("Daily Christian", "https://www.youtube.com/@dailychristian_/shorts"),
              ("Holy Christian Places", "https://www.youtube.com/@holychristianplaces/shorts"),
              ("Capturing Christianity", "https://www.youtube.com/@capturingchristianity/shorts")
          ]

          # New sources receive a complete initial Shorts scan.
          # Earlier channels retain their existing latest-100 collection setting.
          full_scan_channels = {
              "Unity Center of Light", "Reasonable Faith UK", "Parousia Media",
              "The Lila Rose Show", "Bible Alive", "Daily Christian",
              "Holy Christian Places", "Capturing Christianity"
          }

          library_path = Path("video-library.json")
          results_dir = Path("collection-results")
          results_dir.mkdir(exist_ok=True)

          if library_path.exists():
              library = json.loads(
                  library_path.read_text(encoding="utf-8")
              )
          else:
              library = {"version": 2, "items": []}

          items = library.get("items", [])

          if not isinstance(items, list):
              raise ValueError("Invalid video library format")

          seen = {
              str(item.get("id"))
              for item in items
              if isinstance(item, dict)
          }

          reports = []

          for channel_name, channel_url in channels:
              found = 0
              added = 0
              error = ""

              print(f"Checking {channel_name}", flush=True)

              try:
                  options = {
                      "extract_flat": "in_playlist",
                      "skip_download": True,
                      "ignoreerrors": True,
                      "quiet": True,
                      "playlistend": -1 if channel_name in full_scan_channels else 100,
                      "socket_timeout": 20,
                      "retries": 1,
                      "extractor_retries": 1,
                      "sleep_interval_requests": 1
                  }

                  with yt_dlp.YoutubeDL(options) as ydl:
                      result = ydl.extract_info(
                          channel_url,
                          download=False
                      )

                  entries = (result or {}).get("entries") or []

                  for entry in entries:
                      if not isinstance(entry, dict):
                          continue

                      video_id = str(entry.get("id") or "")
                      duration = entry.get("duration")

                      if not re.fullmatch(
                          r"[A-Za-z0-9_-]{11}", video_id
                      ):
                          continue

                      if isinstance(duration, (int, float)):
                          if duration > 180:
                              continue

                      found += 1

                      if video_id in seen:
                          continue

                      seen.add(video_id)

                      items.append({
                          "id": video_id,
                          "source": channel_name,
                          "title": str(
                              entry.get("title") or "YouTube Short"
                          )[:180],
                          "url": (
                              "https://www.youtube.com/shorts/"
                              + video_id
                          )
                      })

                      added += 1

              except Exception as exc:
                  error = str(exc)[:500]
                  print(
                      f"ERROR: {channel_name}: {error}",
                      flush=True
                  )

              reports.append({
                  "channel": channel_name,
                  "found": found,
                  "added": added,
                  "error": error
              })

              library["version"] = 2
              library["items"] = items
              library["last_collection_utc"] = (
                  datetime.now(timezone.utc).isoformat()
              )

              library_path.write_text(
                  json.dumps(
                      library,
                      indent=2,
                      ensure_ascii=False
                  ) + "\n",
                  encoding="utf-8"
              )

              (results_dir / "report.json").write_text(
                  json.dumps(
                      reports,
                      indent=2,
                      ensure_ascii=False
                  ) + "\n",
                  encoding="utf-8"
              )

              print(
                  f"{channel_name}: {found} found, "
                  f"{added} new, {len(items)} total",
                  flush=True
              )

              time.sleep(2)

          print(
              f"COLLECTION COMPLETE: {len(items)} total IDs",
              flush=True
          )

          if not items:
              print(
                  "WARNING: No videos collected. "
                  "Check report.json for channel errors.",
                  flush=True
              )
          PY

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-scroll-results
          path: |
            video-library.json
            collection-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Save video library to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add video-library.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Hope Scroll video library"
            git push origin HEAD:main
            echo "Video library saved successfully."
          fi
